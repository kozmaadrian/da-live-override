<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="local-override-title local-override-desc" id="local-override-root">
      <title id="local-override-title">Local code, original da.live origin</title>
      <desc id="local-override-desc">The extension intercepts configured code paths, fetches files from a local checkout, fulfills the original da.live request with local bytes, and falls back to da.live if the local fetch fails, while other traffic and authentication retain their original routes.</desc>
      <defs>
      <style>#local-override-root { color: #202b3d; font-family: system-ui, sans-serif; }
      #local-override-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#local-override-root .diagram-container { overflow-x: visible; }
}</style>
        <marker id="local-override-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0 0 L8 4 L0 8 Z" fill="#59677b" />
        </marker>
        <marker id="local-override-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0 0 L8 4 L0 8 Z" fill="#145bd7" />
        </marker>
      </defs>
      <rect width="1280" height="720" fill="#ffffff" />
      <g font-family="system-ui, sans-serif" fill="#202b3d">
        <text x="40" y="60" font-size="28" font-weight="600">Local code. Original da.live origin.</text>
        <text x="40" y="96" font-size="14" fill="#59677b">Override enabled · attached da.live / da.page tab · one configured code request</text>

        <rect x="40" y="348" width="1200" height="272" rx="4" fill="#f5f7fa" stroke="#dce2eb" />
        <rect x="40" y="348" width="48" height="24" rx="2" fill="#fff" stroke="#dce2eb" />
        <text x="64" y="365" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#59677b">ALT</text>
        <text x="104" y="376" font-size="14" font-weight="600">Local fetch succeeds</text>
        <line x1="48" y1="476" x2="1232" y2="476" stroke="#dce2eb" stroke-dasharray="5 4" />
        <text x="56" y="504" font-size="14" font-weight="600">Missing local file, non-OK response, or fetch failure</text>

        <g stroke="#c4ccd8" stroke-dasharray="4 5">
          <line x1="160" y1="224" x2="160" y2="620" />
          <line x1="464" y1="224" x2="464" y2="620" />
          <line x1="800" y1="224" x2="800" y2="620" />
          <line x1="1120" y1="224" x2="1120" y2="620" />
        </g>
        <g fill="none" stroke="#59677b" stroke-width="2" marker-end="url(#local-override-arrow)">
          <line x1="160" y1="264" x2="464" y2="264" />
          <line x1="464" y1="324" x2="800" y2="324" />
          <line x1="800" y1="408" x2="464" y2="408" stroke-dasharray="5 4" />
          <line x1="464" y1="540" x2="1120" y2="540" />
          <line x1="1120" y1="592" x2="160" y2="592" stroke-dasharray="5 4" />
        </g>
        <line x1="464" y1="456" x2="160" y2="456" stroke="#145bd7" stroke-width="3" marker-end="url(#local-override-arrow-blue)" />

        <g font-family="ui-monospace, monospace" font-size="12" text-anchor="middle" fill="#59677b">
          <rect x="248" y="232" width="128" height="20" fill="#fff" />
          <text x="312" y="247">REQUEST CODE</text>
          <rect x="576" y="292" width="112" height="20" fill="#fff" />
          <text x="632" y="307">SAME PATH</text>
          <rect x="576" y="380" width="112" height="20" fill="#f5f7fa" />
          <text x="632" y="395">LOCAL BYTES</text>
          <rect x="248" y="428" width="128" height="20" fill="#e2f5e9" />
          <text x="312" y="443" fill="#17653a">FULFILL</text>
          <rect x="736" y="512" width="112" height="20" fill="#f5f7fa" />
          <text x="792" y="527">CONTINUE</text>
          <rect x="576" y="564" width="128" height="20" fill="#f5f7fa" />
          <text x="640" y="579">LIVE BYTES</text>
        </g>

        <rect x="40" y="144" width="240" height="80" rx="6" fill="#fff" stroke="#dce2eb" />
        <rect x="344" y="144" width="240" height="80" rx="6" fill="#eef4ff" stroke="#145bd7" />
        <rect x="680" y="144" width="240" height="80" rx="6" fill="#fff" stroke="#dce2eb" />
        <rect x="1000" y="144" width="240" height="80" rx="6" fill="#fff" stroke="#dce2eb" stroke-dasharray="5 4" />
        <g text-anchor="middle">
          <g font-size="14" font-weight="600">
            <text x="160" y="176">da.live page</text>
            <text x="464" y="176">Override extension</text>
            <text x="800" y="176">Local file server</text>
            <text x="1120" y="176">da.live</text>
          </g>
          <g font-family="ui-monospace, monospace" font-size="12" fill="#59677b">
            <text x="160" y="200">/scripts/scripts.js</text>
            <text x="464" y="200">Chrome debugger / Fetch</text>
            <text x="800" y="200">localhost:5757</text>
            <text x="1120" y="200">Original remote source</text>
          </g>
        </g>
        <text x="800" y="244" text-anchor="middle" font-size="12" fill="#59677b">server.js reads your da-live checkout</text>
        <line x1="40" y1="648" x2="1240" y2="648" stroke="#dce2eb" />
        <text x="40" y="676" font-size="14" font-weight="600" fill="#145bd7">No redirect: local bytes fulfill the original URL via Fetch.fulfillRequest.</text>
        <text x="40" y="700" font-size="14" fill="#59677b">Unmatched traffic stays on da.live. Login keeps its original origin; it is not proxied through localhost.</text>
      </g>
    </svg>
